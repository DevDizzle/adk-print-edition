name: Build PDFs

# Rebuild the PDFs every week from the newest google/adk-docs commit, one job
# per language edition, and publish them as one GitHub release. A scheduled
# run does nothing when a release for that docs commit already exists.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/**"
      - "tools/**"
      - "volumes.yml"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-pdfs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.docs.outputs.sha }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Find the newest docs commit
        id: docs
        run: echo "sha=$(git ls-remote https://github.com/google/adk-docs.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Look for a release of this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.docs.outputs.sha }}
        run: |
          short=${SHA:0:7}
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -- "-$short$" | head -1 || true)
          skip=false
          if [ -n "$tag" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Docs commit $short. Existing release: ${tag:-none}. Skip: $skip." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        lang: [python, go, typescript, java]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the ADK docs at the checked commit
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          git init -q src/adk-docs
          git -C src/adk-docs fetch -q --depth 1 https://github.com/google/adk-docs.git "$SHA"
          git -C src/adk-docs checkout -q FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.12"
      - uses: r-lib/actions/setup-tinytex@v2
      - run: tlmgr install $(cat build/tex-packages.txt)

      - name: Build the ${{ matrix.lang }} edition
        run: python build/build.py --lang ${{ matrix.lang }}
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Check the PDFs
        run: python build/qa.py | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: edition-${{ matrix.lang }}
          path: dist/
          retention-days: 14

  release:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: edition-*
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r sha date < dist/docs-commit.txt
          short=${sha:0:7}
          tag="docs-$date-$short"
          {
            echo "PDFs built from [google/adk-docs@$short](https://github.com/google/adk-docs/commit/$sha) ($date). Letter size, for duplex printing."
            echo
            for lang in python go typescript java; do cat "dist/release-notes-$lang.md"; done
            echo "Unofficial edition. Not affiliated with or endorsed by Google. The ADK documentation is under the Apache License 2.0."
          } > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.pdf --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
            # Remove assets that this build did not make (for example, old file names).
            for a in $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
              [ -f "dist/$a" ] || gh release delete-asset "$tag" "$a" --yes --repo "$GITHUB_REPOSITORY"
            done
          else
            gh release create "$tag" dist/*.pdf --title "ADK docs of $date ($short)" --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
